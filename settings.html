<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anand Chrome Tools · Settings</title>
    <style>
      :root {
        color-scheme: light dark;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        color: light-dark(#242424, #e8e8e8);
        background: light-dark(#f7f7f7, #181818);
      }
      main {
        box-sizing: border-box;
        width: min(620px, calc(100% - 32px));
        margin: 9vh auto;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
        font-weight: 650;
        letter-spacing: -0.02em;
      }
      .intro {
        margin: 0 0 28px;
        color: light-dark(#666, #aaa);
      }
      section {
        padding: 20px;
        background: light-dark(#fff, #222);
        border: 1px solid light-dark(#ddd, #383838);
        border-radius: 10px;
      }
      h2 {
        margin: 0 0 14px;
        font-size: 15px;
      }
      .directory {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      #directory-name {
        min-width: 0;
        overflow: hidden;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #permission {
        flex: none;
        color: light-dark(#666, #aaa);
        font-size: 12px;
      }
      .detail {
        min-height: 42px;
        margin: 6px 0 18px;
        color: light-dark(#666, #aaa);
        font-size: 13px;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        padding: 7px 12px;
        color: light-dark(#fff, #111);
        background: light-dark(#222, #eee);
        border: 0;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
      }
      button.secondary {
        color: inherit;
        background: transparent;
        border: 1px solid light-dark(#ccc, #555);
      }
      button:disabled {
        cursor: default;
        opacity: 0.45;
      }
      button:focus-visible {
        outline: 2px solid Highlight;
        outline-offset: 2px;
      }
      #status {
        min-height: 21px;
        margin: 14px 0 0;
        color: light-dark(#666, #aaa);
        font-size: 13px;
      }
      #status.error {
        color: light-dark(#a52020, #ff938f);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Anand Chrome Tools</h1>
      <p class="intro">Local data settings</p>
      <section>
        <h2>Action logs</h2>
        <div class="directory">
          <span id="directory-name">No folder selected</span>
          <span id="permission"></span>
        </div>
        <p class="detail" id="detail">
          Choose a folder to archive actions once daily into monthly UTC JSONL files.
        </p>
        <div class="actions">
          <button id="choose" type="button">Choose folder</button>
          <button id="sync" class="secondary" type="button" disabled>Sync now</button>
          <button id="disconnect" class="secondary" type="button" disabled>Disconnect</button>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="settings.js"></script>
  </body>
</html>
